# Supabase configuration for BOROOM YITTÉ YU KAWÉ YI
project_id = "boroom-yitte-yu-kawe-yi"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "boroomyitte://auth-callback"
additional_redirect_urls = ["https://app.boroomyitte.org/auth-callback", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[functions.ai-gateway]
verify_jwt = true

[functions.stt-transcribe]
verify_jwt = true

[functions.debate-evaluate]
verify_jwt = true

[functions.english-evaluate]
verify_jwt = true

[functions.quiz-engine]
verify_jwt = true

[functions.livekit-token]
verify_jwt = true

[functions.admin-actions]
verify_jwt = true

[functions.retention-cleanup]
verify_jwt = true
