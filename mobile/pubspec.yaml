name: boroom_yitte
description: "BOROOM YITTÉ YU KAWÉ YI — Écosystème numérique complet d'élévation intellectuelle, spirituelle et professionnelle."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  cupertino_icons: ^1.0.8
  timezone: ^0.10.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  supabase_flutter: ^2.8.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  record: ^7.2.0
  just_audio: ^0.9.42
  permission_handler: ^11.3.1
  livekit_client: ^2.3.4
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.3
  path_provider: ^2.1.5
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.1
  app_links: ^6.3.3
  url_launcher: ^6.3.3
  uuid: ^4.5.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
